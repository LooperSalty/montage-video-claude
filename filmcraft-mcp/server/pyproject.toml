[project]
name = "filmcraft-assist"
version = "0.1.0"
description = "MCP compagnon de FilmCraft : transcription Whisper GPU, beats musicaux, contrôle qualité d'export, planches contact, conformation des rushes."
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp>=1.12,<2",
    "pydantic>=2.7",
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.1,<10; sys_platform == 'win32'",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "pillow>=10.4",
]

[project.scripts]
filmcraft-assist = "filmcraft_assist.server:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filmcraft_assist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
